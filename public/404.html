<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vectus</title>
    <script>
      /**
       * SPA redirect for GitHub Pages — rafgraph/spa-github-pages technique.
       * When GitHub serves a 404, this page re-encodes the URL as a query
       * parameter and redirects to the root, where index.html decodes it back.
       */
      var pathSegmentsToKeep = 1; // = number of path segments in the repo base (/Vectus-2.0)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
