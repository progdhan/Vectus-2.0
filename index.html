<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#6c63ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vectus" />

    <!-- SEO -->
    <title>Vectus — Offline Adaptive Learning</title>
    <meta name="description" content="An offline-first adaptive learning app. Study lessons, take quizzes, and level up — no internet required after first load." />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236c63ff'/><text y='72' x='18' font-size='65' font-family='sans-serif' font-weight='bold' fill='white'>V</text></svg>" />

    <!-- SPA redirect restore: decode path from 404.html's query param -->
    <script>
      (function (l) {
        if (l.search[1] === 'p') {
          var params = l.search.slice(1).split('&');
          var path   = params[0].slice(2).replace(/~and~/g, '&');
          var query  = params[1] ? '?' + params[1].slice(2).replace(/~and~/g, '&') : '';
          window.history.replaceState(
            null, null,
            l.pathname.split('/').slice(0, 2).join('/') + '/' + path + query + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
